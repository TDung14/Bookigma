<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Bookigma favicon</title>
  <desc>Green stack of books with a bookmark and reading glasses, inspired by the Bookigma logo.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79d344"/>
      <stop offset="1" stop-color="#159447"/>
    </linearGradient>
    <linearGradient id="darkGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08764b"/>
      <stop offset="1" stop-color="#004b37"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#ffffff"/>
  <!-- top book -->
  <path d="M12 22.5 43 14.5 55 18.5 24 27Z" fill="#83d64b"/>
  <path d="M12 22.5 24 27 24 32 12 28Z" fill="#159447"/>
  <path d="M24 27 55 18.5 55 23 24 32Z" fill="url(#green)"/>
  <path d="M12 22.5 43 14.5 55 18.5 24 27Z" fill="url(#green)"/>
  <!-- lower book -->
  <path d="M11 35 40 28.5 53 33 23 40Z" fill="#8bd94c"/>
  <path d="M11 35 23 40 23 45 11 40Z" fill="#138746"/>
  <path d="M23 40 53 33 53 38 23 45Z" fill="url(#green)"/>
  <!-- pages -->
  <path d="M13 28.5 24 32 52 24.5 52 27 24 35 13 31.5Z" fill="#f5fff4"/>
  <path d="M13 40.5 23 45 50 38.5 50 41 23 48 13 44Z" fill="#f5fff4"/>
  <!-- bookmark -->
  <path d="M42 22.5 48 21 48 34 45 31.7 42 35Z" fill="url(#darkGreen)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- glasses -->
  <g fill="#e8f7e6" stroke="url(#darkGreen)" stroke-width="2.7" stroke-linejoin="round">
    <circle cx="22" cy="46" r="7.1"/>
    <circle cx="39.5" cy="44.5" r="7.1"/>
    <path d="M29.1 45.6 32.4 45.3" fill="none"/>
    <path d="M14.8 43.8 10.5 42.5M46.5 42.5 51 41" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M18.5 42.8 21.5 41.4M36 41.5 39 40.4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
</svg>

spring.application.name=bookigma

# ========================================
# Spring DevTools
# ========================================
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false


# ========================================
# Database - Railway MySQL
# ========================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50


# ========================================
# Flyway
# ========================================
spring.flyway.enabled=false


# ========================================
# Server
# ========================================
server.port=${PORT:8080}


# ========================================
# JWT
# ========================================
# Bắt buộc đặt JWT_SECRET khi chạy thật (>= 32 byte). Để trống khi dev:
# backend tự sinh khóa ngẫu nhiên mỗi lần khởi động và token cũ sẽ hết hiệu lực.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}


# ========================================
# Google OAuth (Google Identity Services)
# ========================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:}


# ========================================
# Email verification
# ========================================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Chỉ bật ở môi trường dev khi chưa cấu hình SMTP; link sẽ được ghi vào log backend.
app.email-verification.log-link-when-mail-disabled=false


# ========================================
# Mail - Gmail SMTP
# ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# ========================================
# VIP - xác nhận chuyển khoản
# ========================================
# Đặt VIP_WEBHOOK_SECRET trong biến môi trường; tuyệt đối không ghi mã thật vào file này.
app.vip.webhook-secret=${VIP_WEBHOOK_SECRET:}
app.vip.purchase-expiry-minutes=${VIP_PURCHASE_EXPIRY_MINUTES:1440}


# ========================================
# Đơn hàng - hết hạn thanh toán
# ========================================
# Đơn chuyển khoản / MoMo chưa được xác nhận thanh toán sau số giờ này sẽ tự hủy.
app.orders.unpaid-expiry-hours=${ORDER_UNPAID_EXPIRY_HOURS:24}
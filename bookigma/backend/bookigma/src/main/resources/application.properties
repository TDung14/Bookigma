spring.application.name=bookigma

spring.datasource.url=jdbc:mysql://localhost:3306/Bookigma?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# Database schema is managed by sql_script.sql; Hibernate must not alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Nạp các quan hệ lazy theo lô (vd. dòng hàng của cả danh sách đơn) thay vì từng câu một.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=8080
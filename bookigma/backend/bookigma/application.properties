spring.application.name=bookigma



spring.datasource.url=jdbc:mysql://localhost:3306/Bookigma?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1313

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Có flyway-core trong pom nhưng chưa dùng file migration — tắt để khỏi đụng schema MySQL.
spring.flyway.enabled=false

server.port=8080

# ================= MAIL - QUÊN MẬT KHẨU =================
# Khuyến nghị dùng Gmail + App Password, không dùng mật khẩu Gmail chính.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
